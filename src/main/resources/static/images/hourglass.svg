<?xml version="1.0" encoding="UTF-8"?>
<svg width="120px" height="160px" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Hourglass Container -->
  <path d="M30,10 L90,10 L90,30 C90,30 90,50 60,80 C30,50 30,30 30,30 L30,10 Z" fill="none" stroke="#0d6efd" stroke-width="4" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" from="300" to="0" dur="2s" fill="freeze" />
  </path>
  
  <path d="M30,150 L90,150 L90,130 C90,130 90,110 60,80 C30,110 30,130 30,130 L30,150 Z" fill="none" stroke="#0d6efd" stroke-width="4" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" from="300" to="0" dur="2s" begin="1.5s" fill="freeze" />
  </path>
  
  <!-- Top base -->
  <line x1="30" y1="10" x2="90" y2="10" stroke="#0d6efd" stroke-width="4" stroke-dasharray="60" stroke-dashoffset="60">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="0.5s" begin="3s" fill="freeze" />
  </line>
  
  <!-- Bottom base -->
  <line x1="30" y1="150" x2="90" y2="150" stroke="#0d6efd" stroke-width="4" stroke-dasharray="60" stroke-dashoffset="60">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="0.5s" begin="3.5s" fill="freeze" />
  </line>
  
  <!-- Sand particles -->
  <g>
    <circle cx="60" cy="110" r="3" fill="#0d6efd" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4s" fill="freeze" />
    </circle>
    <circle cx="55" cy="105" r="3" fill="#0d6efd" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.2s" fill="freeze" />
    </circle>
    <circle cx="65" cy="105" r="3" fill="#0d6efd" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.4s" fill="freeze" />
    </circle>
    <circle cx="50" cy="100" r="3" fill="#0d6efd" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.6s" fill="freeze" />
    </circle>
    <circle cx="70" cy="100" r="3" fill="#0d6efd" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.8s" fill="freeze" />
    </circle>
  </g>
</svg>
