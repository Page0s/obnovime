spring.application.name=DocAlert

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Railway)
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Database Configuration (Local)
# spring.datasource.url=jdbc:postgresql://localhost:5432/railway_local
# spring.datasource.username=postgres
# spring.datasource.password=soni123
# spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# SQL Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE