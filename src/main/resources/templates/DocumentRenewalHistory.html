<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert - Povijest Obnova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <header class="bg-primary text-white text-center py-4 mb-4">
        <div class="container">
            <h1>DocAlert</h1>
            <p>Povijest obnova dokumenta</p>
            <a href="/main" class="btn btn-light mt-2">Nazad</a>
        </div>
    </header>

    <div class="container">
        <!-- Document Info -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Informacije o dokumentu</h5>
                <strong>Naziv dokumenta:</strong> <span th:text="${document.name}"></span><br>
                <strong>Šifra:</strong> <span th:text="${document.number}"></span><br>
                <strong>Tip dokumenta:</strong> <span th:text="${document.documentType.name}"></span>
            </div>
        </div>

        <!-- History Table -->
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Vrijedio do</th>
                        <th>Obnovio</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:each="entry, stat : ${history}">
                    <td th:text="${stat.count}"></td>
                    <td th:text="${entry.pastRenewalDate != T(java.time.LocalDate).MIN} ? ${#temporals.format(entry.pastRenewalDate, 'dd.MM.yyyy.')} : 'N/A'"></td>
                    <td th:text="${entry.renewedBy.firstName + ' ' + entry.renewedBy.lastName}"></td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">&copy; 2025 ObnoviMe. Sva prava pridržana.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
