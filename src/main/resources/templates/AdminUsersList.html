<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert Admin - Uredi korisnike</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-header {
            background-color: #0D6EFD !important;
        }
        .custom-footer {
            background-color: #212529 !important;
        }
    </style>
</head>
<body>
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <i class="bi bi-clipboard2-pulse fs-1 me-3"></i>
                <div>
                    <h1>DocAlert Admin</h1>
                    <p class="mb-0">Uredi korisnike</p>
                </div>
            </div>
            <div class="col-auto">
                <a href="/admin" class="btn btn-light">Natrag na Admin Panel</a>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="mb-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
            <i class="bi bi-plus-circle me-2"></i>Dodaj novog korisnika
        </button>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Ime</th>
                        <th>Prezime</th>
                        <th>E-mail</th>
                        <th>Lozinka</th>
                        <th>Broj telefona</th>
                        <th>Odjel</th>
                        <th>Akcije</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="appUser : ${appUser}">
                        <td th:text="${appUser.firstName}"></td>
                        <td th:text="${appUser.lastName}"></td>
                        <td th:text="${appUser.email}"></td>
                        <td>••••••••</td> <!-- Lozinke ne prikazujemo iz sigurnosnih razloga -->
                        <td th:text="${appUser.phoneNumber}"></td>
                        <td th:text="${appUser.department}"></td>
                        <td>
                            <button class="btn btn-sm btn-secondary me-1" title="Uredi">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" title="Obriši">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal za dodavanje novog korisnika -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addUserModalLabel">Dodaj novog korisnika</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="ime" class="form-label">Ime</label>
                        <input type="text" class="form-control" id="ime" required>
                    </div>
                    <div class="mb-3">
                        <label for="prezime" class="form-label">Prezime</label>
                        <input type="text" class="form-control" id="prezime" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="lozinka" class="form-label">Lozinka</label>
                        <input type="password" class="form-control" id="lozinka" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefon" class="form-label">Broj telefona</label>
                        <input type="tel" class="form-control" id="telefon">
                    </div>
                    <div class="mb-3">
                        <label for="odjel" class="form-label">Odjel</label>
                        <input type="text" class="form-control" id="odjel">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
                <button type="button" class="btn btn-primary">Spremi korisnika</button>
            </div>
        </div>
    </div>
</div>

<footer class="custom-footer text-white text-center py-3 mt-4">
    <p class="mb-0">&copy; 2025 DocAlert. Sva prava pridržana.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
