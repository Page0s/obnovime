<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert Admin - Sustav za praćenje dokumenata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-header {
            background-color: #0D6EFD !important;
        }
        .custom-footer {
            background-color: #212529 !important;
        }
        .admin-button {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<!-- Header Section -->
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                <div>
                    <h1>DocAlert Admin</h1>
                    <p class="mb-0">Sustav za praćenje i obnavljanje dokumenata, licenci i opreme</p>
                </div>
            </div>
            <div class="col-auto">
                <div class="text-end">
                    <small class="d-block text-white mb-1">Prijavljeni korisnik</small>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                        </button>
                        <ul class="dropdown-menu">
                            <li><h6 class="dropdown-header">Korisnik</h6></li>
                            <li><a class="dropdown-item" href="#"><span th:text="${session.user.firstName}">Korisnik</span></a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="/logout">Odjavi se</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <!-- Admin Options -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <a href="/adminUsersList" class="btn btn-primary admin-button">
                <i class="bi bi-people-fill me-2"></i>Uredi korisnike
            </a>
        </div>
        <div class="col-md-6">
            <a href="/adminDocumentTypeList" class="btn btn-primary admin-button">
                <i class="bi bi-file-earmark-text-fill me-2"></i>Uredi tipove dokumenata
            </a>
        </div>
    </div>

    <div class="col-md-6">
        <a href="/adminLocationList" class="btn btn-primary admin-button">
            <i class="bi bi-geo-alt-fill me-2"></i>Uredi lokacije
        </a>
    </div>

    <!-- Footer -->
    <footer class="custom-footer text-white text-center py-3 mt-4">
        <p class="mb-0">&copy; 2025 DocAlert. Sva prava pridržana.</p>
    </footer>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
