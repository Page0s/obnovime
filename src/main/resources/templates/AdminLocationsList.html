<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert Admin - Lokacije</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-header {
            background-color: #0D6EFD !important;
        }
        .custom-footer {
            background-color: #212529 !important;
        }
    </style>
</head>
<body>
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                <div>
                    <h1>DocAlert Admin</h1>
                    <p class="mb-0">Uredi lokacije</p>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="mb-4 d-flex justify-content-end gap-2">
        <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#addLocationModal">
            <i class="bi bi-plus-circle me-2"></i>Dodaj lokaciju
        </button>
        <a href="/admin" class="btn btn-secondary">Natrag na Admin Panel</a>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>Naziv lokacije</th>
                    <th>Akcije</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="loc : ${locations}">
                    <td th:text="${loc.name}"></td>
                    <td>
                        <button class="btn btn-sm btn-secondary me-1 edit-location-button"
                                th:attr="data-id=${loc.id}, data-name=${loc.name}">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/adminLocationList/delete}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${loc.id}">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Dodaj -->
<div class="modal fade" id="addLocationModal" tabindex="-1" aria-labelledby="addLocationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/adminLocationList/add}" method="post">
            <div class="modal-header">
                <h5 class="modal-title" id="addLocationModalLabel">Dodaj lokaciju</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label for="locationName" class="form-label">Naziv lokacije</label>
                <input type="text" class="form-control" id="locationName" name="name" required>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Spremi</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Uredi -->
<div class="modal fade" id="editLocationModal" tabindex="-1" aria-labelledby="editLocationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/adminLocationList/update}" method="post">
            <input type="hidden" name="id" id="editLocationId">
            <div class="modal-header">
                <h5 class="modal-title" id="editLocationModalLabel">Uredi lokaciju</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label for="editLocationName" class="form-label">Naziv lokacije</label>
                <input type="text" class="form-control" id="editLocationName" name="name" required>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Spremi promjene</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast: Lokacija nije obrisana -->
<div class="position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 9999">
    <div id="locationErrorToast" class="toast align-items-center text-bg-danger border-0"
         role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true">
        <div class="d-flex">
            <div class="toast-body">
                Lokacija je povezana s dokumentima i ne može se obrisati.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Zatvori"></button>
        </div>
    </div>
</div>

<!-- Toast: Lokacija uspješno obrisana -->
<div class="position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 9999">
    <div id="locationDeletedToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                Lokacija je uspješno obrisana.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Zatvori"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.edit-location-button').forEach(button => {
            button.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                const name = this.getAttribute('data-name');
                document.getElementById('editLocationId').value = id;
                document.getElementById('editLocationName').value = name;
                new bootstrap.Modal(document.getElementById('editLocationModal')).show();
            });
        });

        const errorMessage = /*[[${error}]]*/ '';
        const successMessage = /*[[${success}]]*/ '';

        if (errorMessage === 'Lokacija je povezana s dokumentima i ne može se obrisati.') {
            const toastEl = document.getElementById('locationErrorToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 4000, autohide: true });
            toast.show();
        }

        if (successMessage === 'Lokacija uspješno obrisana.') {
            const toastEl = document.getElementById('locationDeletedToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
        }
    });
</script>

</body>
</html>
