<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert - Unos Dokumenata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<style>
    .custom-header {
        background-color: #0d6efd; /* Plava boja kao u Bootstrapu */
        padding: 20px 0;
    }
</style>
<body>
<!-- Header Section -->
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                <div>
                    <h1>DocAlert</h1>
                    <p class="mb-0">Unos novog dokumenta</p>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container mt-5">
    <h1 class="mb-4">Dodaj Novi Dokument</h1>

    <!-- Forma za općeniti tip dokumenta (odmah vidljiva) -->
    <div id="generalForm">
        <form th:action="@{/saveDocument}" method="post">
            <!-- Tip dokumenta -->
            <div class="mb-3">
                <label for="documentCategory" class="form-label">Tip dokumenta:</label>
                <select class="form-select" id="documentCategory" name="documentTypeId" required>
                    <option value="">Odaberite tip dokumenta</option>
                    <option th:each="type : ${document_types}"
                            th:value="${type.id}"
                            th:text="${type.name}"
                            th:selected="${document.documentType?.id == type.id}">
                    </option>
                </select>
            </div>



            <!-- Naziv -->
            <div class="mb-3">
                <label for="name" class="form-label">Naziv:</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Unesite naziv dokumenta" required>
            </div>

            <!-- Šifra -->
            <div class="mb-3">
                <label for="identificationNumber" class="form-label">Šifra:</label>
                <input type="text" class="form-control" id="identificationNumber" name="identificationNumber" placeholder="Unesite šifru dokumenta" required>
            </div>

            <!-- Datum obnove -->
            <div class="mb-3">
                <label for="renewalDate" class="form-label">Datum obnove (Do kad vrijedi):</label>
                <input type="date" class="form-control" id="renewalDate" name="renewalDate" required>
            </div>

            <!-- Partner -->
            <div class="mb-3">
                <label for="service" class="form-label">Partner:</label>
                <input type="text" class="form-control" id="service" name="service" placeholder="Unesite naziv partnera">
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">Ispostava:</label>
                <select class="form-select" id="location" name="locationId" required>
                    <option value="">Odaberite ispostavu</option>
                    <option th:each="loc : ${locations}"
                            th:value="${loc.id}"
                            th:text="${loc.name}"
                            th:selected="${document.location?.id == loc.id}">
                    </option>
                </select>
            </div>


            <div class="mb-3">
                <label for="resourceType" class="form-label">Vrsta resursa:</label>
                <select class="form-select" id="resourceType" name="resourceTypeId" required>
                    <option value="">Odaberite vrstu resursa</option>
                    <option th:each="res : ${resource_types}"
                            th:value="${res.id}"
                            th:text="${res.name}"
                            th:selected="${document.resourceType?.id == res.id}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="responsiblePerson" class="form-label">Odgovorna osoba:</label>
                <select class="form-select" id="responsiblePerson" name="responsiblePersonId" required>
                    <option th:each="user : ${app_users}"
                            th:value="${user.id}"
                            th:text="${user.firstName + ' ' + user.lastName}"
                            th:selected="${user.firstName == 'Nema odgovorne osobe'}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="notes" class="form-label">Napomena:</label>
                <textarea class="form-control" id="notes" name="notes" placeholder="Unesite napomenu"></textarea>
            </div>



            <!-- Akcijske tipke -->
            <div class="d-flex justify-content-start align-items-end gap-2">
                <button type="submit" class="btn btn-primary flex-grow-0">Spremi</button>
                <a href="/main" class="btn btn-secondary flex-grow-0">Nazad</a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap Modal -->
<div class="modal fade" id="confirmationModalRenewal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmationModalLabel">Potvrda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zatvori"></button>
            </div>
            <div class="modal-body">
                Jeste li sigurni da želite spremiti promjene?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitForm()">Potvrdi</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Nazad</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal za upozorenje o nepopunjenim poljima -->
<div class="modal fade" id="validationModal" tabindex="-1" aria-labelledby="validationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="validationModalLabel">Upozorenje</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zatvori"></button>
            </div>
            <div class="modal-body">
                Molim popunite sva obavezna polja
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">U redu</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Footer Section -->
<footer class="bg-dark text-white text-center py-3 mt-4">
    <p>&copy; 2025 DocAlert. Sva prava pridržana.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts.js"></script>

</body>
</html>
