<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Document Expiration Alert</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f8f9fa; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .button { display: inline-block; padding: 10px 20px; background-color: #007bff; 
                 color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Document Expiration Alert</h1>
            <p th:text="${alertType}">Alert Type</p>
        </div>
        
        <div class="content">
            <p>The following documents require your attention:</p>
            
            <table>
                <thead>
                    <tr>
                        <th>Document Name</th>
                        <th>Document Type</th>
                        <th>Number</th>
                        <th>Renewal Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc : ${documents}">
                        <td th:text="${doc.name}">Document Name</td>
                        <td th:text="${doc.documentType?.name}">Document Type</td>
                        <td th:text="${doc.number}">Number</td>
                        <td th:text="${#temporals.format(doc.renewalDate, 'dd.MM.yyyy')}">Renewal Date</td>
                    </tr>
                </tbody>
            </table>
            
            <a th:href="${appUrl}" class="button">Go to Application</a>
        </div>
    </div>
</body>
</html>
