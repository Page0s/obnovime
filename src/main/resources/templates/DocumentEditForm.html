<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
    <style>
        .custom-header {
            background-color: #0d6efd; /* Plava boja kao u Bootstrapu */
            padding: 20px 0;
        }
    </style>
    <body>
    <!-- Header Section -->
    <header class="custom-header text-white py-4 mb-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col d-flex align-items-center">
                    <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                    <div>
                        <h1>DocAlert</h1>
                    </div>
                </div>
            </div>
        </div>
    </header>

<div class="container mt-5">
    <!-- Navigacijske kartice -->
    <ul class="nav nav-tabs bg-white text-dark" id="editTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button
                    class="nav-link text-dark active"
                    id="uredivanje-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#uredivanje"
                    type="button"
                    role="tab"
                    aria-controls="uredivanje"
                    aria-selected="true">
                Uređivanje dokumenata
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button
                    class="nav-link text-dark"
                    id="povijest-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#povijest"
                    type="button"
                    role="tab"
                    aria-controls="povijest"
                    aria-selected="false">
                Povijest obnova
            </button>
        </li>
    </ul>


    <div class="tab-content" id="editTabsContent">
        <!-- TAB 1: Uređivanje -->
        <div class="tab-pane fade show active p-3 border border-top-0"
             id="uredivanje"
             role="tabpanel"
             aria-labelledby="uredivanje-tab">


    <form id="editForm" th:action="@{/updateDocument}" method="post" class="border rounded p-4 shadow" onsubmit="showConfirmationModal(event)">
        <input type="hidden" name="id" th:value="${document.id}">

        <div class="mb-3">
            <label for="name" class="form-label">Naziv Dokumenta</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${document.name}" required>
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">Ispostava:</label>
            <select class="form-select" id="location" name="locationId" required>
                <option value="">Odaberite ispostavu</option>
                <option th:each="loc : ${locations}"
                        th:value="${loc.id}"
                        th:text="${loc.name}"
                        th:selected="${document.location?.id == loc.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="serviceProvider" class="form-label">Partner</label>
            <input type="text" class="form-control" id="serviceProvider" name="serviceProvider" th:value="${document.serviceProvider}">
        </div>

        <div class="mb-3">
            <label for="responsiblePerson" class="form-label">Odgovorna osoba</label>
            <select class="form-select" id="responsiblePerson" name="responsiblePersonId" required>
                <option th:each="user : ${app_users}"
                        th:value="${user.id}"
                        th:text="${user.firstName + ' ' + user.lastName}"
                        th:selected="${document.responsiblePerson?.id == user.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="notes" class="form-label">Napomena</label>
            <textarea class="form-control" id="notes" name="notes" placeholder="Unesite napomenu (nije obavezno)" th:text="${document.notes}"></textarea>
        </div>

        <div class="text-left">
            <button type="submit" class="btn btn-primary">Spremi</button>
            <button type="button" class="btn btn-secondary" onclick="history.back()">Nazad</button>
        </div>
    </form>
</div>

        <!-- TAB 2: Povijest obnova -->
        <div class="tab-pane fade p-3 border border-top-0"
             id="povijest"
             role="tabpanel"
             aria-labelledby="povijest-tab">
            <div class="container">
                <!-- Document Info -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Informacije o dokumentu</h5>
                        <strong>Naziv dokumenta:</strong> <span th:text="${document.name}"></span><br>
                        <strong>Šifra:</strong> <span th:text="${document.number}"></span><br>
                        <strong>Tip dokumenta:</strong> <span th:text="${document.documentType.name}"></span>
                    </div>
                </div>

                <!-- History Table -->
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Vrijedio do</th>
                            <th>Obnovio</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry, stat : ${history}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${entry.pastRenewalDate != T(java.time.LocalDate).MIN} ? ${#temporals.format(entry.pastRenewalDate, 'dd.MM.yyyy.')} : 'N/A'"></td>
                            <td th:text="${entry.renewedBy.firstName + ' ' + entry.renewedBy.lastName}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn btn-secondary" onclick="history.back()">Nazad</button>
                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap Modal -->
<div class="modal fade" id="confirmationModalEdit" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmationModalLabel">Potvrda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zatvori"></button>
            </div>
            <div class="modal-body">
                Jeste li sigurni da želite spremiti izmjene?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitFormEdit()">Potvrdi</button>
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Nazad</button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-4">
    <p>&copy; 2025 ObnoviMe. Sva prava pridržana.</p>
</footer>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts.js"></script>

<script>
    function showConfirmationModal(event) {
        event.preventDefault(); // Sprječava odmah slanje forme
        var modal = new bootstrap.Modal(document.getElementById('confirmationModalEdit'));
        modal.show();
    }

    function submitFormEdit() {
        document.getElementById("editForm").submit(); // Ručno šalje formu
    }
</script>

</body>
</html>
