<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert - Korisnički profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-header {
            background-color: #0D6EFD !important;
        }
        .custom-footer {
            background-color: #212529 !important;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .password-field {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
<!-- Header Section -->
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                <div>
                    <h1>DocAlert</h1>
                    <p class="mb-0">Sustav za praćenje i obnavljanje dokumenata, licenci i opreme</p>
                </div>
            </div>
            <div class="col-auto">
                <div class="text-end">
                    <small class="d-block text-white mb-1">Prijavljeni korisnik</small>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                        </button>
                        <ul class="dropdown-menu">
                            <li><h6 class="dropdown-header">Korisnik</h6></li>
                            <li><a class="dropdown-item" href="#"><span th:text="${session.user.firstName}">Korisnik</span></a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person-circle"></i> Profil</a></li>
                            <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right"></i> Odjavi se</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-person-circle me-2"></i>Korisnički profil</h4>
                </div>
                <div class="card-body">
                    <!-- Success message -->
                    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        Profil je uspješno ažuriran!
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <form th:action="@{/profile/update}" method="post" th:object="${user}">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{userType}">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="firstName" class="form-label">Ime</label>
                                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="lastName" class="form-label">Prezime</label>
                                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phoneNumber" class="form-label">Broj telefona</label>
                            <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}">
                        </div>
                        
                        <div class="form-group">
                            <label for="department" class="form-label">Odjel</label>
                            <input type="text" class="form-control" id="department" th:field="*{department}">
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Lozinka</label>
                            <div class="password-field">
                                <input type="password" class="form-control" id="password" name="password" th:value="${user.password}">
                                <span class="password-toggle" onclick="togglePasswordVisibility()">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </span>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-start mt-4">
                            <button type="submit" class="btn btn-primary me-md-2">Spremi</button>
                            <a href="/main" class="btn btn-secondary" id="backButton" data-prevent-spam="true" data-loading-text="Učitavanje...">Nazad</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="custom-footer text-white text-center py-3 mt-4">
        <p class="mb-0">&copy; 2025 DocAlert. Sva prava pridržana.</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts.js"></script>
<script>
    function togglePasswordVisibility() {
        const passwordField = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
        } else {
            passwordField.type = 'password';
            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');
        }
    }
</script>
</body>
</html>
