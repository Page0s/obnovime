<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - DocAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header .icon {
            font-size: 3rem;
            color: #0d6efd;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
        }
        .footer {
            margin-top: auto;
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 1rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #0d6efd;
        }
        /* Animation canvas styles */
        #animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
        .form-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            border-radius: 15px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(13, 110, 253, 0.3);
            border-radius: 50%;
            border-top-color: #0d6efd;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Animation container for p5.js -->
    <div id="animation-container"></div>
    
    <div class="login-container">
        <div class="login-card">
            <!-- Overlay for loading spinner -->
            <div id="form-overlay" class="form-overlay" style="display: none;">
                <div class="spinner"></div>
            </div>
            
            <div class="login-header">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="85" class="me-2">
                <h2 class="mt-3">DocAlert</h2>
                <p class="text-muted">Prijavite se u sustav</p>
            </div>

            <form id="login-form" th:action="@{/login}" method="post">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" placeholder="ime@primjer.com" required>
                    <label for="email">Email adresa</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Lozinka" required>
                    <label for="password">Lozinka</label>
                </div>
               <!-- Add later segment for forgot password --> 
                <!-- 
                <div class="forgot-password">
                    <a href="#" class="text-decoration-none">Zaboravili ste lozinku?</a>
                </div>
                -->
                <button type="submit" class="btn btn-primary btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Prijava
                </button>

                <div class="text-center mt-3">
                    <div th:if="${error}" class="alert alert-danger">
                        Neispravni podaci za prijavu
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Uspješno ste odjavljeni
                    </div>
                </div>
                
                <a href="/" class="back-link">
                    <i class="bi bi-arrow-left"></i> Natrag na početnu
                </a>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer py-4 bg-dark text-light">
        <div class="container text-center">
            <p>&copy; 2025 DocAlert. Sva prava pridržana.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Reference to scripts.js file -->
    <script src="/scripts.js"></script>
</body>
</html>
