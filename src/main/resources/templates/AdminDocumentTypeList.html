<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert Admin - Uredi tip dokumenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-header {
            background-color: #0D6EFD !important;
        }
        .custom-footer {
            background-color: #212529 !important;
        }
    </style>
</head>
<body>
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                <div>
                    <h1>DocAlert Admin</h1>
                    <p class="mb-0">Uredi tip dokumenta</p>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="mb-4 d-flex justify-content-end gap-2">
        <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#addDocumentTypeModal">
            <i class="bi bi-plus-circle me-2"></i>Dodaj novi tip dokumenta
        </button>
        <a href="/admin" class="btn btn-secondary">Natrag na Admin Panel</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead>
                    <tr>
                        <th>Naziv</th>
                        <th>Broj dana za podsjetnik</th>
                        <th>Akcije</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="documentType : ${documentTypes}">
                        <td th:text="${documentType.name}">Licenca</td>
                        <td th:text="${documentType.renewalPeriod}">30</td>
                        <td>
                            <button class="btn btn-sm btn-secondary me-1" title="Uredi"
                                    th:attr="onclick=|openEditModal('${documentType.id}', '${documentType.name}', '${documentType.renewalPeriod}')|">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <form th:action="@{/adminDocumentTypeList/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${documentType.id}">
                                <button type="submit" class="btn btn-sm btn-danger" title="Obriši"
                                        onclick="return confirm('Jeste li sigurni da želite obrisati ovaj tip dokumenta?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>


                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal za dodavanje novog tipa dokumenta -->
<div class="modal fade" id="addDocumentTypeModal" tabindex="-1" aria-labelledby="addDocumentTypeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addDocumentTypeModalLabel">Dodaj novi tip dokumenta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addDocumentForm" th:action="@{/adminDocumentTypeList/add}" th:object="${newDocumentType}" method="post">
                    <div class="mb-3">
                        <label for="nazivDokumenta" class="form-label">Naziv</label>
                        <input type="text" class="form-control" id="nazivDokumenta" th:field="*{name}" required>
                    </div>
                    <div class="mb-3">
                        <label for="brojDanaPodsjetnik" class="form-label">Broj dana za podsjetnik</label>
                        <input type="number" class="form-control" id="brojDanaPodsjetnik" th:field="*{renewalPeriod}" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-start">
                <button type="button" class="btn btn-primary" onclick="submitAddForm()">Spremi tip dokumenta</button>
                <button type="button" class="btn btn-secondary ms-2" data-bs-dismiss="modal">Odustani</button>
            </div>
        </div>
    </div>
</div>


<!-- Modal za uređivanje tipa dokumenta -->
<div class="modal fade" id="editDocumentTypeModal" tabindex="-1" aria-labelledby="editDocumentTypeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editDocumentTypeModalLabel">Uredi tip dokumenta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editDocumentForm" th:action="@{/adminDocumentTypeList/update}" method="post">
                <input type="hidden" id="editId" name="id"> <!-- ID dokumenta -->

                    <div class="mb-3">
                        <label for="editNazivDokumenta" class="form-label">Naziv</label>
                        <input type="text" class="form-control" id="editNazivDokumenta" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="editBrojDanaPodsjetnik" class="form-label">Broj dana za podsjetnik</label>
                        <input type="number" class="form-control" id="editBrojDanaPodsjetnik" name="renewalPeriod" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-start">
                <button type="submit" class="btn btn-primary" onclick="submitEditForm()">Spremi</button>
                <button type="button" class="btn btn-secondary ms-2" data-bs-dismiss="modal">Odustani</button>
            </div>
        </div>
    </div>
</div>


<footer class="custom-footer text-white text-center py-3 mt-4">
    <p class="mb-0">&copy; 2025 DocAlert. Sva prava pridržana.</p>
</footer>

<script>
    function openEditModal(id, name, renewalPeriod) {
        document.getElementById('editId').value = id;
        document.getElementById('editNazivDokumenta').value = name;
        document.getElementById('editBrojDanaPodsjetnik').value = renewalPeriod;
        var editModal = new bootstrap.Modal(document.getElementById('editDocumentTypeModal'));
        editModal.show();
    }

    function submitEditForm() {
        document.getElementById('editDocumentForm').submit();
    }
</script>

<script>
    function submitAddForm() {
        document.getElementById('addDocumentForm').submit();
    }
</script>

<script>
    function deleteDocumentType(id) {
        if (confirm("Jeste li sigurni da želite obrisati ovaj tip dokumenta?")) {
            window.location.href = "/adminDocumentTypeList/delete/" + id;
        }
    }
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
