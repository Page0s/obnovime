<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAlert Admin - Uredi tip dokumenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-header {
            background-color: #0D6EFD !important;
        }
        .custom-footer {
            background-color: #212529 !important;
        }
    </style>
</head>
<body>
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <i class="bi bi-clipboard2-pulse fs-1 me-3"></i>
                <div>
                    <h1>DocAlert Admin</h1>
                    <p class="mb-0">Uredi tip dokumenta</p>
                </div>
            </div>
            <div class="col-auto">
                <a href="/admin" class="btn btn-light">Natrag na Admin Panel</a>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="mb-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDocumentTypeModal">
            <i class="bi bi-plus-circle me-2"></i>Dodaj novi tip dokumenta
        </button>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Naziv</th>
                        <th>Broj dana za podsjetnik</th>
                        <th>Akcije</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="documentType : ${documentTypes}">
                        <td th:text="${documentType.name}">Licenca</td>
                        <td th:text="${documentType.renewalPeriod}">30</td>
                        <td>
                            <button class="btn btn-sm btn-secondary me-1" title="Uredi">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" title="Obriši">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal za dodavanje novog tipa dokumenta -->
<div class="modal fade" id="addDocumentTypeModal" tabindex="-1" aria-labelledby="addDocumentTypeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addDocumentTypeModalLabel">Dodaj novi tip dokumenta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="nazivDokumenta" class="form-label">Naziv</label>
                        <input type="text" class="form-control" id="nazivDokumenta" required>
                    </div>
                    <div class="mb-3">
                        <label for="brojDanaPodsjetnik" class="form-label">Broj dana za podsjetnik</label>
                        <input type="number" class="form-control" id="brojDanaPodsjetnik" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
                <button type="button" class="btn btn-primary">Spremi tip dokumenta</button>
            </div>
        </div>
    </div>
</div>

<footer class="custom-footer text-white text-center py-3 mt-4">
    <p class="mb-0">&copy; 2025 DocAlert. Sva prava pridržana.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
