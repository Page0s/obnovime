<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DocAlert - Arhiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"/>
    <style>
        .custom-header {
            background-color: #0d6efd; /* Plava boja kao u Bootstrapu */
            padding: 20px 0;
        }
    </style>
</head>
<body>
<!-- Header Section -->
<header class="custom-header text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col d-flex align-items-center">
                <img src="/images/logo.svg" alt="DocAlert Logo" height="60" class="me-2">
                <div>
                    <h1>DocAlert</h1>
                    <p class="mb-0">Arhiva dokumenata</p>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container mb-4 d-flex justify-content-end gap-2">
    <a href="/main" class="btn btn-secondary">Nazad</a>
</div>

<div class="container">
    <!-- Documents Table -->
    <div class="table-responsive mb-4">
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>Naziv</th>
                <th>Šifra</th>
                <th>Datum obnove</th>
                <th>Status</th>
                <th>Partner</th>
                <th>Lokacija</th>
                <th>Vrsta resursa</th>
                <th>Tip dokumenta</th>
                <th>Akcija</th>
            </tr>
            </thead>
            <tbody th:each="document : ${documents}">
            <tr>
                <!-- Naziv -->
                <td th:text="${document.name}">Naziv dokumenta</td>

                <!-- Šifra -->
                <td th:text="${document.number}">Serijski broj</td>

                <!-- Datum obnove -->
                <td th:text="${document.renewalDate}">2025-12-31</td>

                <!-- Status (uvijek "Arhivirano") -->
                <td>
                    <span class="badge bg-secondary">Arhivirano</span>
                </td>

                <!-- Partner (serviceProvider) -->
                <td th:text="${document.serviceProvider}">Partner</td>

                <!-- Lokacija (locationName) -->
                <td th:text="${document.locationName}">Lokacija</td>

                <!-- Vrsta resursa (resourceTypeName) -->
                <td th:text="${document.resourceTypeName}">Vrsta resursa</td>

                <!-- Tip dokumenta (documentTypeName) -->
                <td th:text="${document.documentTypeName}">Tip dokumenta</td>

                <!-- Akcija: POST unarchive -->
                <td>
                    <form method="post"
                          th:action="@{/document/{id}/unarchive(id=${document.id})}"
                          style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-success">
                            <i class="bi bi-arrow-return-left"></i> Aktiviraj
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- PAGINATION (kopirano i prilagođeno iz DocumentMainForm.html) -->
    <div class="d-flex justify-content-center mt-4">
        <nav aria-label="Paginacija arhive">
            <!-- Definiramo varijable za "windowed" prikaz (±4 stranice oko trenutne) -->
            <div th:with="
                rangeSize=2,
                startPage=${(currentPage - rangeSize) < 0} ? 0 : ${currentPage - rangeSize},
                endPage=${(currentPage + rangeSize) >= (totalPages - 1)} ? ${totalPages - 1} : ${currentPage + rangeSize}
            ">
                <ul class="pagination">

                    <!-- PRVA STRANICA: << -->
                    <li class="page-item" th:classappend="${currentPage} == 0 ? 'disabled'">
                        <a class="page-link text-dark"
                           th:href="@{/archive(page=0, size=10)}"
                           aria-label="Prva">
                            <i class="bi bi-chevron-double-left"></i>
                        </a>
                    </li>

                    <!-- PRETHODNA: < -->
                    <li class="page-item" th:classappend="${currentPage} == 0 ? 'disabled'">
                        <a class="page-link text-dark"
                           th:href="@{/archive(page=${(currentPage - 1) < 0} ? 0 : ${currentPage - 1}, size=10)}"
                           aria-label="Prethodna">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>

                    <!-- "WINDOWED" PRIKAZ: stranice unutar [startPage, endPage] -->
                    <li class="page-item" th:each="p : ${#numbers.sequence(startPage, endPage)}">
                        <!-- Ako p nije trenutna stranica -> link -->
                        <a class="page-link text-dark"
                           th:if="${p} != ${currentPage}"
                           th:text="${p + 1}"
                           th:href="@{/archive(page=${p}, size=10)}">
                        </a>
                        <!-- Ako p jest trenutna stranica -> aktivan gumb -->
                        <span class="page-link bg-secondary text-black" th:if="${p} == ${currentPage}" th:text="${p + 1}">
                        </span>
                    </li>

                    <!-- SLJEDEĆA: > -->
                    <li class="page-item"
                        th:classappend="${currentPage} == ${totalPages - 1} ? 'disabled'">
                        <a class="page-link text-dark"
                           th:href="@{/archive(page=${(currentPage + 1) >= (totalPages - 1)} ? ${totalPages - 1} : ${currentPage + 1}, size=10)}"
                           aria-label="Sljedeća">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>

                    <!-- ZADNJA STRANICA: >> -->
                    <li class="page-item"
                        th:classappend="${currentPage} == ${totalPages - 1} ? 'disabled'">
                        <a class="page-link text-dark"
                           th:href="@{/archive(page=${totalPages - 1}, size=10)}"
                           aria-label="Zadnja">
                            <i class="bi bi-chevron-double-right"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="text-center mt-2">
        <p>
            Stranica
            <span th:text="${currentPage + 1}">1</span>
            od
            <span th:text="${totalPages}">5</span>
        </p>
    </div>
</div>

<!-- Footer Section -->
<footer class="bg-dark text-white text-center py-3 mt-4">
    <p class="mb-0">&copy; 2025 DocAlert. Sva prava pridržana.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
